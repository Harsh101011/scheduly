services:
  - type: web
    name: scheduly-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # You'll fill this in the Render dashboard
      - key: PORT
        value: 10000
